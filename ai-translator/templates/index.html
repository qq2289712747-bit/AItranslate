<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>在线 AI 翻译小助手</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
    <div class="container">
        <h1>在线 AI 翻译小助手</h1>
        <p>输入中文 → 自动翻译成日语</p>

        <form id="translateForm">
            <textarea name="text" id="textInput" placeholder="请输入要翻译的内容"></textarea>
            <button type="submit">翻译</button>
        </form>

        <h2>翻译结果：</h2>
        <div id="resultBox"></div>
    </div>

    <script>
        document.getElementById("translateForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const text = document.getElementById("textInput").value;
            const response = await fetch("/translate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text })
            });

            const data = await response.json();
            document.getElementById("resultBox").innerText = data.translated;
        });
    </script>
</body>
</html>
